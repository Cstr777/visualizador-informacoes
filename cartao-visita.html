<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Visita Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .card-preview {
            perspective: 1000px;
            height: 300px;
            margin-bottom: 30px;
        }

        .business-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .card-header {
            position: relative;
            z-index: 1;
        }

        .card-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .card-divider {
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            margin: 15px 0;
        }

        .card-footer {
            position: relative;
            z-index: 1;
        }

        .card-info {
            font-size: 0.85em;
            line-height: 1.6;
            opacity: 0.95;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .card-info p {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-info i {
            width: 16px;
            text-align: center;
        }

        .color-picker-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .color-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .color-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .color-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .color-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .color-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

        .export-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .export-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .export-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .export-btn {
            padding: 10px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .export-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }

            .color-picker-group {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💼 Cartão de Visita Digital</h1>
        <p>Crie seu cartão de visita personalizado em tempo real</p>
    </div>

    <div class="container">
        <!-- Prévia do Cartão -->
        <div class="card-preview">
            <div class="business-card" id="businessCard">
                <div class="card-header">
                    <div class="card-name" id="previewName">Seu Nome</div>
                    <div class="card-title" id="previewTitle">Sua Profissão</div>
                </div>
                <div class="card-divider"></div>
                <div class="card-footer">
                    <div class="card-info">
                        <p><i class="fas fa-envelope"></i> <span id="previewEmail">seu@email.com</span></p>
                        <p><i class="fas fa-phone"></i> <span id="previewPhone">(XX) XXXXX-XXXX</span></p>
                        <p><i class="fas fa-map-marker-alt"></i> <span id="previewLocation">Sua Cidade</span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Seleção de Cores -->
        <div class="form-section">
            <h2>🎨 Escolha uma Cor</h2>
            <div class="color-picker-group">
                <div class="color-option color-1 active" onclick="changeCardColor('linear-gradient(135deg, #667eea 0%, #764ba2 100%)'); this.parentElement.querySelectorAll('.color-option').forEach(el => el.classList.remove('active')); this.classList.add('active');"></div>
                <div class="color-option color-2" onclick="changeCardColor('linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'); this.parentElement.querySelectorAll('.color-option').forEach(el => el.classList.remove('active')); this.classList.add('active');"></div>
                <div class="color-option color-3" onclick="changeCardColor('linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'); this.parentElement.querySelectorAll('.color-option').forEach(el => el.classList.remove('active')); this.classList.add('active');"></div>
                <div class="color-option color-4" onclick="changeCardColor('linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)'); this.parentElement.querySelectorAll('.color-option').forEach(el => el.classList.remove('active')); this.classList.add('active');"></div>
                <div class="color-option color-5" onclick="changeCardColor('linear-gradient(135deg, #fa709a 0%, #fee140 100%)'); this.parentElement.querySelectorAll('.color-option').forEach(el => el.classList.remove('active')); this.classList.add('active');"></div>
            </div>
        </div>

        <!-- Formulário de Edição -->
        <div class="form-section">
            <h2>📝 Seus Dados</h2>

            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" placeholder="Digite seu nome" onkeyup="updateCard()">
            </div>

            <div class="form-group">
                <label for="title">Cargo/Profissão</label>
                <input type="text" id="title" placeholder="Ex: Designer Gráfico" onkeyup="updateCard()">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" onkeyup="updateCard()">
            </div>

            <div class="form-group">
                <label for="phone">Telefone</label>
                <input type="tel" id="phone" placeholder="(XX) XXXXX-XXXX" onkeyup="updateCard()">
            </div>

            <div class="form-group">
                <label for="location">Cidade/Localização</label>
                <input type="text" id="location" placeholder="Sua Cidade, Estado" onkeyup="updateCard()">
            </div>

            <div class="form-group">
                <label for="company">Empresa</label>
                <input type="text" id="company" placeholder="Nome da sua empresa (opcional)" onkeyup="updateCard()">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="preencherExemplo()">📋 Exemplo</button>
                <button class="btn-secondary" onclick="limparFormulario()">🗑️ Limpar</button>
            </div>
        </div>

        <!-- Exportar Cartão -->
        <div class="export-section">
            <h3>💾 Exportar Cartão</h3>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportarPNG()">
                    <i class="fas fa-image"></i> PNG
                </button>
                <button class="export-btn" onclick="exportarJSON()">
                    <i class="fas fa-code"></i> JSON
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="cartao.js"></script>
</body>
</html>
